name: JARVIS Room offline unittest

on:
  push:
    branches: [main, feature/sprint3-ha-laboratorio-readonly, feature/sprint4-samsung-ha-control, feature/sprint5-samsung-natural-commands, feature/sprint6-room-orchestration, feature/sprint7-voice-interaction]
    paths:
      - 'projects/jarvis-room/**'
      - '.github/workflows/jarvis-room-unittest.yml'
      - 'src/openjarvis/speech/**'
  pull_request:
    branches: [main]
    paths:
      - 'projects/jarvis-room/**'
      - '.github/workflows/jarvis-room-unittest.yml'
      - 'src/openjarvis/speech/**'

permissions:
  contents: read

jobs:
  unittest-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regressão offline com hardware, rede, modelos e subprocessos reais proibidos
        env:
          PYTHONPATH: projects/jarvis-room/src:src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python projects/jarvis-room/scripts/run_offline_tests.py
      - name: Verificar whitespace
        run: git diff --check HEAD^ HEAD
