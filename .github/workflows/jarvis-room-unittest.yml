name: JARVIS Room offline unittest

on:
  push:
    branches: [main, feature/sprint3-ha-laboratorio-readonly, feature/sprint4-samsung-ha-control]
    paths:
      - 'projects/jarvis-room/**'
      - '.github/workflows/jarvis-room-unittest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/jarvis-room/**'
      - '.github/workflows/jarvis-room-unittest.yml'

permissions:
  contents: read

jobs:
  unittest-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes locais sem Docker, HA, credenciais operacionais ou LLM
        env:
          PYTHONPATH: projects/jarvis-room/src
        run: python -m unittest discover -s projects/jarvis-room/tests -p 'test_*.py' -v
