name: JARVIS Room presentation offline

on:
  push:
    branches: [main, feature/sprint9-voice-frontend-integration, feature/sprint9-1-jarvis-wake-persona]
    paths: ['projects/jarvis-room/frontend/**', 'projects/jarvis-room/config/room_*.json', '.github/workflows/jarvis-room-presentation.yml']
  pull_request:
    branches: [main]
    paths: ['projects/jarvis-room/frontend/**', 'projects/jarvis-room/config/room_*.json', '.github/workflows/jarvis-room-presentation.yml']

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/jarvis-room/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/jarvis-room/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Preparar somente o navegador de teste
        run: ./node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Dois monitores com serviços falsos e GPU desativada
        run: npm run test:e2e
